name: "Cross-Repository Breaking Change Guardian Runner"

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '**/*.java'
      - '**/*.kt'
      - '**/*.proto'
      - '**/*.json'
      - '**/dto/**'
      - '**/controller/**'
      - '**/api/**'
      - '**/model/**'
      - '**/client/**'
      - '**/contract/**'
      - '.github/workflows/**'
  push:
    branches:
      - main
      - master
      - 'release/**'
      - develop
    paths:
      - '**/*.java'
      - '**/*.kt'
      - '**/*.proto'
      - '**/*.json'
      - '**/dto/**'
      - '**/controller/**'
      - '**/api/**'
      - '**/model/**'
      - '**/client/**'
      - '**/contract/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  run-guardian:
    name: "Compile & Run gh-aw Guardian"
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT1 || secrets.GITHUB_TOKEN }}

      - name: "Install GitHub Agentic Workflows CLI"
        env:
          GH_TOKEN: ${{ secrets.PAT1 || secrets.GITHUB_TOKEN }}
        run: |
          gh extension install github/gh-aw

      - name: "Compile gh-aw Markdown Workflow"
        env:
          GH_TOKEN: ${{ secrets.PAT1 || secrets.GITHUB_TOKEN }}
        run: |
          gh aw compile

      - name: "Commit Lock File if Updated"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/*.lock.yml || true
          if git diff --staged --quiet; then
            echo "Lock file is already up to date."
          else
            git commit -m "chore: auto-compile gh-aw lock file [skip ci]"
            git push origin HEAD:${{ github.ref }} || true
          fi

      - name: "Execute gh-aw Guardian Workflow"
        env:
          GH_TOKEN: ${{ secrets.PAT1 || secrets.GITHUB_TOKEN }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.PAT1 || secrets.GITHUB_TOKEN }}
        run: |
          MD_FILE=$(find .github/workflows -maxdepth 1 -name "*.md" | head -n 1)
          if [ -n "$MD_FILE" ]; then
            WORKFLOW_NAME=$(basename "$MD_FILE" .md)
            echo "Found gh-aw workflow: $WORKFLOW_NAME"
            gh aw run "$WORKFLOW_NAME" || true
          else
            echo "No .md workflow found in .github/workflows."
          fi
